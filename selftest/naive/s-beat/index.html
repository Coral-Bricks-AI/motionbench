</style></head><body><div id="stage"><div class="abs h" style="left:0;top:478px;width:1920px;display:flex;justify-content:center;gap:28px"><span data-role="word-1" style="display:inline-block;opacity:0">All</span><span data-role="word-2" style="display:inline-block;opacity:0">models,</span><span data-role="word-3" style="display:inline-block;opacity:0">one</span><span data-role="word-4" style="display:inline-block;opacity:0">API.</span></div></div>
<script src="assets/gsap.min.js"></script>
<script>(function(){
const tl = gsap.timeline({paused:true});
for (let i=0;i<4;i++){ const w=`[data-role=word-${i+1}]`, beat=0.5+i*0.5;
  tl.fromTo(w,{y:60,opacity:0},{y:0,opacity:1,duration:0.35,ease:"power3.out"},beat); }
tl.set({}, {}, 3.0);
window.__timelines = window.__timelines || {};
window.__timelines.main = tl;
})();</script></body></html>
