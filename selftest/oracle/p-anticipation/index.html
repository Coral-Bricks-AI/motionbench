@font-face{font-family:"Open Sauce Two";src:url(assets/fonts/OpenSauceTwo-SemiBold.ttf);font-weight:600}

</style></head><body><div id="stage"><div class="abs" data-role="floor" style="left:0;top:759px;width:1920px;height:2px;background:#DDDFE4"></div><div class="abs" data-role="puck" style="left:300px;top:640px;width:120px;height:120px;border-radius:50%;background:#D44027"></div></div>
<script src="assets/gsap.min.js"></script>
<script>(function(){
const tl = gsap.timeline({paused:true});
tl.to("[data-role=puck]",{x:-40,duration:0.35,ease:"power2.inOut"},0.6).to("[data-role=puck]",{x:1200,duration:0.9,ease:"power3.out"},0.95);
tl.set({}, {}, 2.5);
window.__timelines = window.__timelines || {};
window.__timelines.main = tl;
})();</script></body></html>
